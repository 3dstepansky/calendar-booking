events {
    worker_connections 1024;
}

http {
    server {
        listen 443 ssl;
        server_name stepansky.mywire.org;

        ssl_certificate /etc/letsencrypt/live/stepansky.mywire.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stepansky.mywire.org/privkey.pem;

        # Рекомендуемые настройки безопасности SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
